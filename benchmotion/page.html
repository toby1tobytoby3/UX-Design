<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Motion benchmark</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#fcfcfb;color:#1f1f1e;font:13px/1.4 system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 24px 0} header b{font-size:18px} header span{color:#52514e}
  main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 24px 24px}
  section{background:#fff;border:1px solid #ecebe7;border-radius:10px;padding:10px 12px 10px}
  h2{margin:0 0 6px;font-size:13px;font-weight:600} h2 small{color:#52514e;font-weight:400}
  .view{position:relative;height:300px;width:100%;border-radius:8px;overflow:hidden;background:#f4f3ef}
  .na{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#52514e;background:repeating-linear-gradient(135deg,#fff 0 8px,#f6f5f2 8px 16px);text-align:center;padding:24px}
  .na b{color:#1f1f1e}
  .fill{position:absolute;inset:0}
  .cards{position:absolute;inset:16px;display:grid;grid-template-columns:repeat(3,1fr);align-items:start;gap:12px}
  .card{height:96px;background:#fff;border:1px solid #e3e2de;border-radius:12px;padding:12px;box-shadow:0 1px 2px #0000000d}
  .card.open{position:absolute;inset:0;height:auto;z-index:2;box-shadow:0 12px 32px #0000002a;border-color:#2a78d6}
  .list{list-style:none;margin:0;padding:16px;display:flex;flex-direction:column;gap:8px}
  .item{height:40px;display:flex;align-items:center;padding:0 12px;background:#fff;border:1px solid #e3e2de;border-radius:10px;box-shadow:0 1px 2px #0000000d}
  .drawer{position:absolute;left:16px;top:16px;bottom:16px;width:160px;background:#fff;border:1px solid #e3e2de;border-radius:12px;box-shadow:0 8px 24px #00000022;border-left:4px solid #2a78d6}
  .bar{position:absolute;left:0;right:0;top:0;height:6px;background:#2a78d6;transform-origin:0 50%;transform:scaleX(0);z-index:3}
  .scroller{position:absolute;inset:6px 0 0;overflow-y:auto}
  .filler{height:400px;display:flex;align-items:center;justify-content:center;color:#8a8984}
  .reveal{margin:0 24px;height:100px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e3e2de;border-radius:12px;font-weight:600}
  #stress{position:fixed;left:24px;right:24px;bottom:-40px;height:28px} /* just below the fold: painted, not in the screenshot */
  .box{display:inline-block;width:12px;height:12px;margin:1px;background:#eb6834;border-radius:2px}
</style></head><body>
<div id="root"></div>
<script src="LIB.js"></script>
</body></html>
