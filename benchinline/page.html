<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Inline AI benchmark</title>
<link rel="stylesheet" href="LIB.css"><link rel="stylesheet" href="LIB.tw.css">
<style>
  *{box-sizing:border-box} body{margin:0;background:#fcfcfb;color:#1f1f1e;font:14px/1.45 system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 24px 0} header b{font-size:18px} header span{color:#52514e}
  main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 24px 24px}
  section{background:#fff;border:1px solid #ecebe7;border-radius:10px;padding:10px 12px}
  h2{margin:0 0 6px;font-size:13px;font-weight:600} h2 small{color:#52514e;font-weight:400}
  .view{position:relative;min-height:300px}
  .na{height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#52514e;background:repeating-linear-gradient(135deg,#fff 0 8px,#f6f5f2 8px 16px);text-align:center;padding:24px;border-radius:8px}
  .na b{color:#1f1f1e}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  label{display:block;font-weight:600;font-size:12px;margin:0 0 4px}
  textarea,input{width:100%;font:inherit;padding:8px 10px;border:1px solid #c9c8c3;border-radius:8px;background:#fff}
  textarea:focus-visible,input:focus-visible,button:focus-visible,[contenteditable]:focus-visible{outline:2px solid #1d63b8;outline-offset:2px}
  .hint{margin:4px 0 0;color:#52514e;font-size:12px}
  .ghost{color:#6b6a66}
  button{font:inherit;font-size:13px;padding:5px 10px;border-radius:7px;border:1px solid #c9c8c3;background:#fff;cursor:pointer}
  .actions{display:flex;gap:6px;align-items:center;margin:6px 0}
  .pill{font-size:12px;color:#52514e}
  .menu,.popover{position:absolute;z-index:20;background:#fff;border:1px solid #c9c8c3;border-radius:10px;box-shadow:0 12px 32px #0000002a;min-width:280px;padding:4px}
  .menu{left:12px;top:40px} .menu ul,[cmdk-list]{list-style:none;margin:4px 0 0;padding:0} .menu li,[cmdk-item]{padding:6px 8px;border-radius:6px;cursor:pointer}
  .menu li[aria-selected=true],[cmdk-item][data-selected=true]{background:#e8f0fb}
  .review{border:1px solid #c9c8c3;border-radius:8px;padding:6px 10px;margin-top:6px;max-height:160px;overflow:auto}
  .diff{margin:0;font-size:13px} ins{background:#dff3e9;text-decoration:none} del{background:#fbe4e4;color:#7a1f1f}
  .fill .row{display:grid;grid-template-columns:110px 1fr auto;gap:6px;align-items:center;margin:4px 0} .fill .row label{margin:0}
  .ai-chip{margin-left:6px;font-size:10px;font-weight:700;color:#5b3fb8;background:#efeafd;border-radius:4px;padding:1px 4px}
  [data-slate-editor]{min-height:120px;border:1px solid #c9c8c3;border-radius:8px;padding:8px 10px}
  .text-muted-foreground\/70{color:#6b6a66}
  .bn-container{border:1px solid #c9c8c3;border-radius:8px;min-height:140px}
</style></head><body>
<div id="root"></div>
<script type="module" src="LIB.js"></script>
</body></html>
