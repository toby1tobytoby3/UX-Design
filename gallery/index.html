<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --chip: #f5f5f4; --accent: #4f46e5; --accent-soft: #eef2ff; --warn: #b45309; --warn-soft: #fef3c7;
    --shadow: 0 1px 2px #0000000d, 0 8px 24px #0000000a; --star: #d97706; --scrim: #1c191799;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --line: #292524;
      --chip: #292524; --accent: #818cf8; --accent-soft: #1e1b4b; --warn: #fbbf24; --warn-soft: #422006;
      --shadow: 0 1px 2px #0006, 0 8px 24px #0004; --star: #fbbf24; --scrim: #000000b3; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --line: #292524;
    --chip: #292524; --accent: #818cf8; --accent-soft: #1e1b4b; --warn: #fbbf24; --warn-soft: #422006;
    --shadow: 0 1px 2px #0006, 0 8px 24px #0004; --star: #fbbf24; --scrim: #000000b3; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .gutter { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1400px; margin: 0 auto; padding-block: 12px; display: flex; gap: 10px 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: -0.01em; white-space: nowrap; }
  h1 span { color: var(--muted); font-weight: 400; }
  input[type=search], select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; color: var(--text); min-height: 36px; }
  input[type=search] { flex: 1 1 260px; min-width: 0; }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); white-space: nowrap; min-height: 36px; }
  .kinds { display: flex; gap: 2px; background: var(--chip); border-radius: 8px; padding: 3px; }
  .kinds button { border: 0; background: none; border-radius: 6px; padding: 4px 10px; min-height: 30px; cursor: pointer; color: var(--muted); }
  .kinds button[aria-pressed=true] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .pill.src { background: var(--text); color: var(--bg); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; min-height: 36px; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .badge { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .badge[hidden] { display: none; }
  #open-filters { display: none; }

  /* Filters: inline under the header on wide screens, a bottom sheet on phones. */
  .filters { max-width: 1400px; margin: 0 auto; padding-block: 14px 4px; }
  .controls { display: flex; gap: 10px 12px; flex-wrap: wrap; align-items: center; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .tag { border: 1px solid var(--line); background: var(--chip); border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); min-height: 28px; }
  .tag small { opacity: .7; margin-left: 2px; }
  .tag[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .more { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 3px 6px; min-height: 28px; }
  .sheet-title { display: none; }
  .applied { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .applied .chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 3px 6px 3px 10px; font-size: 12px; cursor: pointer; min-height: 28px; }
  .applied .count { color: var(--muted); margin-right: 6px; }

  #sheet { margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88dvh; border-radius: 16px 16px 0 0; padding: 0; }
  #sheet .sheet-body { overflow: auto; max-height: calc(88dvh - 72px); padding: 8px 16px 16px; }
  #sheet .sheet-body .filters { padding: 0; }
  #sheet .sheet-body .controls { flex-direction: column; align-items: stretch; }
  #sheet .sheet-body .sheet-title { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -8px; background: var(--panel); padding: 12px 0 8px; z-index: 1; }
  #sheet .sheet-body .sheet-title h2 { font-size: 16px; margin: 0; outline: none; }
  #sheet .sheet-body .tag { min-height: 36px; font-size: 13px; }
  #sheet footer { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--panel); }
  #sheet footer .primary { flex: 1; }

  main { max-width: 1400px; margin: 0 auto; padding-block: 20px 64px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; justify-content: flex-start; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .thumb { aspect-ratio: 16 / 10; background: var(--chip); display: block; width: 100%; object-fit: cover; object-position: top; border-bottom: 1px solid var(--line); }
  .card .body { padding: 12px 14px 14px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; line-height: 1.35; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; }
  .pill { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--muted); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.ok { background: var(--accent-soft); color: var(--accent); }
  .stars { color: var(--star); letter-spacing: 1px; }
  .empty { text-align: center; padding: 80px 0; color: var(--muted); }

  dialog { border: 0; padding: 0; width: min(1100px, 100vw - 32px); max-height: calc(100vh - 32px); border-radius: 14px; background: var(--panel); color: var(--text); box-shadow: 0 30px 80px #0005; }
  dialog::backdrop { background: var(--scrim); }
  .d { display: grid; grid-template-columns: 1.4fr 1fr; max-height: calc(100vh - 32px); }
  .d .media { background: var(--chip); overflow: auto; }
  .d .media img { display: block; width: 100%; }
  .views { display: flex; gap: 6px; padding: 10px; position: sticky; top: 0; background: var(--chip); border-bottom: 1px solid var(--line); }
  .views button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .views button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .d .info { padding: 20px 22px; overflow: auto; }
  .d h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.01em; }
  .why { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin: 14px 0; }
  .why b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .links { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; font-size: 13px; }
  .md h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  .md p, .md ul { margin: 6px 0; } .md ul { padding-left: 18px; }
  .md blockquote { margin: 14px 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .tbl { overflow-x: auto; margin: 8px 0; }
  .tbl table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
  .tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .tbl th { color: var(--muted); font-weight: 600; }
  code { background: var(--chip); border-radius: 4px; padding: 1px 4px; font-size: 12px; }
  .close { position: absolute; top: 10px; right: 12px; z-index: 2; border: 0; background: var(--panel); border-radius: 99px; width: 36px; height: 36px; cursor: pointer; box-shadow: var(--shadow); }
  @media (max-width: 760px) {
    .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .bar { padding-block: 10px; }
    /* Two rows: title + Show switch, then search + Filters. The entry count moves to the results line. */
    h1 { flex: 1; margin: 0; }
    h1 span { display: none; }
    .kinds button { padding: 4px 9px; }
    input[type=search] { flex: 1 1 200px; font-size: 16px; order: 3; } /* 16px stops iOS zooming on focus */
    #open-filters { order: 4; }
    #open-filters { display: inline-block; }
    main { padding-block: 14px 48px; }
    .grid { gap: 14px; }
    /* Entry detail: full screen, close button always in reach. */
    #dlg { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
    .d { grid-template-columns: 1fr; overflow: auto; max-height: 100dvh; }
    .d .media, .d .info { overflow: visible; }
    .d .info { padding: 16px 16px 40px; }
    .views { overflow-x: auto; padding-right: 56px; }
    .views button { flex: none; min-height: 32px; }
    .close { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 10px; width: 44px; height: 44px; font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar gutter">
    <h1>UX Library <span id="total"></span></h1>
    <div class="kinds" role="group" aria-label="Show">
      <button data-kind="" aria-pressed="true">All</button><button data-kind="pattern" aria-pressed="false">Patterns</button><button data-kind="source" aria-pressed="false">Sources</button>
    </div>
    <input type="search" id="q" placeholder="Search titles, techniques, sites…" aria-label="Search">
    <button class="btn" id="open-filters" aria-haspopup="dialog">Filters<span class="badge" id="nfilters" hidden></span></button>
  </div>
</header>

<div class="filters gutter" id="filters">
  <div class="sheet-title"><h2 id="sheet-title" tabindex="-1">Filters</h2></div>
  <div class="controls">
    <select id="pattern" aria-label="Pattern"><option value="">All patterns</option></select>
    <select id="page" aria-label="Page type"><option value="">All page types</option></select>
    <select id="rating" aria-label="Minimum rating">
      <option value="0">Any rating</option><option value="3">★★★+</option><option value="4">★★★★+</option><option value="5">★★★★★</option>
    </select>
    <label class="chk"><input type="checkbox" id="captured"> Real captures only</label>
    <label class="chk"><input type="checkbox" id="example"> Has code example</label>
  </div>
  <div class="tags" id="tags" role="group" aria-label="Filter by tag"></div>
</div>

<main class="gutter">
  <div class="applied" id="applied" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-body" id="sheet-body"></div>
  <footer><button class="btn" id="clear-all">Clear all</button><button class="btn primary" id="show-results">Show results</button></footer>
</dialog>

<dialog id="dlg" aria-labelledby="dlg-title">
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="d">
    <div class="media"><div class="views" id="views"></div><img id="dlg-img" alt=""></div>
    <div class="info" id="dlg-info"></div>
  </div>
</dialog>

<script src="data.js"></script>
<script>
  const REPO = 'https://github.com/toby1tobytoby3/UX-Design/blob/main/';
  const BASE = window.UX_BASE ?? '../'; // where entries/ lives relative to this page
  const data = window.CATALOG || [];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const stars = (n) => '★'.repeat(n || 0);
  const tagsOf = (e) => Array.isArray(e.tags) ? e.tags : [];
  const isSource = (e) => e.kind === 'source';
  let kind = '';
  document.querySelectorAll('.kinds button').forEach((b) => b.onclick = () => {
    kind = b.dataset.kind;
    document.querySelectorAll('.kinds button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    render();
  });
  const isCaptured = (e) => isSource(e) || !e.needs_capture && e.images.some((i) => !/\/preview\.\w+$/.test(i));

  const activeTags = new Set();
  const uniq = (arr) => [...new Set(arr)].filter(Boolean).sort();

  function fill(select, values) {
    for (const v of values) select.add(new Option(v, v));
  }
  fill($('pattern'), uniq(data.map((e) => e.pattern)));
  fill($('page'), uniq(data.map((e) => e.page_type)));
  $('total').textContent = `· ${data.length} entries`;

  // Tags, most common first, each with its count. Only the top few show until "More tags" is pressed.
  const TOP_TAGS = 12;
  const tagCount = {};
  for (const t of data.flatMap(tagsOf)) tagCount[t] = (tagCount[t] || 0) + 1;
  const allTags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b));
  let showAllTags = false;
  function renderTags() {
    const box = $('tags');
    box.innerHTML = '';
    const shown = showAllTags ? allTags : allTags.filter((t, i) => i < TOP_TAGS || activeTags.has(t));
    for (const t of shown) {
      const b = document.createElement('button');
      b.className = 'tag'; b.setAttribute('aria-pressed', activeTags.has(t));
      b.innerHTML = `${esc(t)} <small>${tagCount[t]}</small>`;
      b.onclick = () => { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); renderTags(); render(); };
      box.append(b);
    }
    const more = document.createElement('button');
    more.className = 'more'; more.setAttribute('aria-expanded', showAllTags);
    more.textContent = showAllTags ? 'Fewer tags' : `More tags (${allTags.length - TOP_TAGS})`;
    more.onclick = () => { showAllTags = !showAllTags; renderTags(); };
    box.append(more);
  }
  renderTags();

  function matches(e) {
    const q = $('q').value.trim().toLowerCase();
    if (q) {
      const hay = [e.title, e.pattern, e.page_type, e.source_site, e.why_it_works, e.use_when, e.body, tagsOf(e).join(' ')].join(' ').toLowerCase();
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    if (kind && e.kind !== kind) return false;
    if ($('pattern').value && e.pattern !== $('pattern').value) return false;
    if ($('page').value && e.page_type !== $('page').value) return false;
    if ((e.rating || 0) < Number($('rating').value)) return false;
    if ($('captured').checked && !isCaptured(e)) return false;
    if ($('example').checked && !e.has_example) return false;
    for (const t of activeTags) if (!tagsOf(e).includes(t)) return false;
    return true;
  }

  function render() {
    // Sources first (best score first), then patterns by rating.
    const list = data.filter(matches).sort((a, b) =>
      (isSource(b) - isSource(a)) || ((b.score || 0) - (a.score || 0)) || ((b.rating || 0) - (a.rating || 0)));
    renderApplied(list.length);
    $('grid').innerHTML = list.length ? '' : '<div class="empty">No entries match. Clear a filter, or add a reference with ux-add.</div>';
    for (const e of list) {
      const card = document.createElement('button');
      card.className = 'card';
      card.innerHTML = `
        ${e.images[0] ? `<img class="thumb" loading="lazy" src="${BASE}${esc(e.images[0])}" alt="">` : '<div class="thumb"></div>'}
        <div class="body">
          <h3>${esc(e.title)}</h3>
          <div class="meta">${isSource(e) ? `<span class="pill src">Source · ${esc(e.score)}/10</span><span class="pill">${esc(e.pattern)}</span><span>${esc(e.licence)}</span>` : `<span class="pill">${esc(e.pattern)}</span><span>${esc(e.source_site)}</span><span class="stars" aria-label="${e.rating} stars">${stars(e.rating)}</span>`}
          ${isCaptured(e) ? '' : `<span class="pill warn">${e.images.every((i) => /\/preview\.\w+$/.test(i)) ? 'preview only' : 'needs capture'}</span>`}${e.has_example ? '<span class="pill ok">code</span>' : ''}</div>
        </div>`;
      card.onclick = () => open(e);
      $('grid').append(card);
    }
  }

  // Tiny markdown: ## headings, - lists, > quotes, **bold**, `code`, paragraphs.
  function md(src) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    let html = '', list = false, para = [];
    const flush = () => { if (para.length) html += `<p>${inline(para.join(' '))}</p>`; para = []; };
    for (const raw of src.split('\n')) {
      const line = raw.trim();
      if (list && !line.startsWith('- ')) { html += '</ul>'; list = false; }
      if (!line || /^(## |- |> |\|)/.test(line)) flush();
      if (line.startsWith('|')) {
        if (/^\|[\s:|-]+\|$/.test(line)) continue; // header separator
        const cells = line.slice(1, -1).split('|').map((c) => inline(c.trim()));
        const head = !html.endsWith('</tr>');
        html += `${head ? '<div class="tbl"><table>' : ''}<tr>${cells.map((c) => head ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`;
        continue;
      }
      if (html.endsWith('</tr>')) html += '</table></div>';
      if (!line) continue;
      if (line.startsWith('## ')) html += `<h2>${inline(line.slice(3))}</h2>`;
      else if (line.startsWith('- ')) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(line.slice(2))}</li>`; }
      else if (line.startsWith('> ')) html += `<blockquote>${inline(line.slice(2))}</blockquote>`;
      else para.push(line);
    }
    flush();
    if (html.endsWith('</tr>')) html += '</table></div>';
    return html + (list ? '</ul>' : '');
  }

  function open(e) {
    const views = $('views');
    views.innerHTML = '';
    e.images.forEach((src, i) => {
      const b = document.createElement('button');
      b.textContent = src.split('/').pop().replace(/\.\w+$/, '');
      b.onclick = () => {
        $('dlg-img').src = BASE + src;
        views.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      };
      views.append(b);
      if (i === 0) b.click();
    });
    if (!e.images.length) $('dlg-img').removeAttribute('src');

    const file = (f) => e.files.includes(f);
    $('dlg-info').innerHTML = `
      <h2 id="dlg-title">${esc(e.title)}</h2>
      <div class="meta"><span class="pill">${esc(e.pattern)}</span><span class="pill">${esc(e.page_type)}</span>
        <span class="stars">${stars(e.rating)}</span>${tagsOf(e).map((t) => `<span class="pill">${esc(t)}</span>`).join('')}</div>
      <div class="why"><b>Why it works</b>${esc(e.why_it_works)}</div>
      <div><b>${isSource(e) ? 'Pick it for' : 'Use when'}:</b> ${esc(e.use_when)}</div>
      ${e.avoid_when ? `<div><b>Avoid when:</b> ${esc(e.avoid_when)}</div>` : ''}
      ${isSource(e) ? `<p class="meta"><span class="pill src">${esc(e.score)}/10</span><span>${esc(e.licence)} · v${esc(e.version)}</span>${Array.isArray(e.alternatives) ? `<span>Alternatives: ${e.alternatives.map(esc).join(', ')}</span>` : ''}</p>` : ''}
      <div class="links">
        ${e.source_url && e.source_url !== 'unknown' ? `<a href="${esc(e.source_url)}" target="_blank" rel="noopener">Source: ${esc(e.source_site)} ↗</a>` : ''}
        ${file('preview.html') ? `<a href="${BASE}${esc(e.path)}/preview.html" target="_blank">Open rebuild preview ↗</a>` : ''}
        ${e.files.filter((f) => !f.endsWith('.md') && f !== 'preview.html').map((f) => `<a href="${REPO}${esc(e.path)}/${esc(f)}" target="_blank" rel="noopener">${esc(f)} ↗</a>`).join('')}
        <a href="${REPO}${esc(e.path)}/${isSource(e) ? 'source.md' : 'entry.md'}" target="_blank" rel="noopener">${isSource(e) ? 'Profile' : 'Entry'} on GitHub ↗</a>
      </div>
      <div class="md">${md(e.body)}</div>
      <p class="meta">Path: <code>${esc(e.path)}</code> · captured ${esc(e.captured_at)} by ${esc(e.captured_by)}</p>`;
    $('dlg').showModal();
    $('dlg').scrollTop = 0;
  }

  // Applied filters as removable chips, so what's active is visible even when the filter sheet is closed.
  function applied() {
    const out = [];
    const sel = (id, label) => { if ($(id).value && $(id).value !== '0') out.push([label($(id).selectedOptions[0].text), () => { $(id).value = $(id).options[0].value; }]); };
    sel('pattern', (t) => t); sel('page', (t) => t); sel('rating', (t) => t);
    if ($('captured').checked) out.push(['Real captures', () => { $('captured').checked = false; }]);
    if ($('example').checked) out.push(['Has code', () => { $('example').checked = false; }]);
    for (const t of activeTags) out.push([t, () => activeTags.delete(t)]);
    return out;
  }
  function renderApplied(n) {
    const list = applied(), box = $('applied');
    box.innerHTML = `<span class="count">${n} of ${data.length} shown</span>`;
    for (const [label, clear] of list) {
      const b = document.createElement('button');
      b.className = 'chip'; b.innerHTML = `${esc(label)} <span aria-hidden="true">✕</span>`;
      b.setAttribute('aria-label', `Remove filter ${label}`);
      b.onclick = () => { clear(); renderTags(); render(); };
      box.append(b);
    }
    if (list.length) { const c = document.createElement('button'); c.className = 'more'; c.textContent = 'Clear all'; c.onclick = clearAll; box.append(c); }
    $('nfilters').hidden = !list.length; $('nfilters').textContent = list.length;
    $('show-results').textContent = `Show ${n} result${n === 1 ? '' : 's'}`;
  }
  function clearAll() {
    ['pattern', 'page'].forEach((id) => { $(id).value = ''; }); $('rating').value = '0';
    $('captured').checked = $('example').checked = false; activeTags.clear();
    renderTags(); render();
  }

  // Phones: the filter panel moves into a bottom sheet behind the Filters button; wider screens keep it inline.
  const phone = matchMedia('(max-width: 760px)');
  const placeFilters = () => {
    if (phone.matches) $('sheet-body').append($('filters'));
    else { if ($('sheet').open) $('sheet').close(); document.querySelector('header').after($('filters')); }
  };
  phone.addEventListener('change', placeFilters); placeFilters();
  $('open-filters').onclick = () => { $('sheet').showModal(); $('sheet-title').focus(); };
  $('show-results').onclick = () => $('sheet').close();
  $('clear-all').onclick = clearAll;
  $('sheet').addEventListener('click', (ev) => { if (ev.target === $('sheet')) $('sheet').close(); });

  $('close').onclick = () => $('dlg').close();
  $('dlg').addEventListener('click', (ev) => { if (ev.target === $('dlg')) $('dlg').close(); });
  ['q', 'pattern', 'page', 'rating', 'captured', 'example'].forEach((id) => $(id).addEventListener('input', render));
  render();
</script>
</body>
</html>
