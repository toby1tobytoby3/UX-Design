<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#222;font:14px/1.3 system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden}
header{border-bottom:1px solid #ebebeb;padding:20px 80px 32px;text-align:center}.logo{color:#ff385c;font-weight:800;font-size:22px;text-align:left}
.tabs{margin:-6px 0 20px;font-size:16px}.tabs b{border-bottom:2px solid #222;padding-bottom:6px}.tabs span{color:#717171;margin-left:24px}
.bar{display:inline-flex;align-items:center;background:#ebebeb;border:1px solid #ddd;border-radius:99px;box-shadow:0 3px 12px #0000001a;text-align:left}
.seg{padding:14px 32px;border-radius:99px;position:relative}.seg+.seg:before{content:"";position:absolute;left:0;top:25%;height:50%;border-left:1px solid #ddd}
.seg.on{background:#fff;box-shadow:0 6px 20px #0003}.seg.on+.seg:before{display:none}
.seg b{display:block;font-size:12px}.seg span{color:#717171}
.go{margin:0 8px;background:#ff385c;color:#fff;border-radius:99px;padding:14px 20px;font-weight:600}
.pop{position:absolute;left:300px;top:200px;width:420px;background:#fff;border-radius:32px;box-shadow:0 6px 24px #0003;padding:24px 16px}
.pop h6{font-size:12px;padding:0 16px 8px}.r{display:flex;gap:14px;align-items:center;padding:10px 16px;border-radius:12px}.r:first-of-type{background:#f7f7f7}
.r i{width:48px;height:48px;border-radius:10px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-style:normal}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:40px 80px}.grid div{height:220px;border-radius:14px;background:#f2f2f2}
</style></head><body>
<header><div class="logo">● stays</div><div class="tabs"><b>Homes</b><span>Experiences</span><span>Services</span></div>
<div class="bar"><div class="seg on"><b>Where</b><span>Search destinations</span></div><div class="seg"><b>Check in</b><span>Add dates</span></div><div class="seg"><b>Check out</b><span>Add dates</span></div><div class="seg"><b>Who</b><span>Add guests</span></div><span class="go">⌕ Search</span></div></header>
<div class="pop"><h6>Suggested destinations</h6><div class="r"><i>➤</i><div><b>Nearby</b><br><span style="color:#717171">Find what's around you</span></div></div><div class="r"><i>🏙</i><div><b>Lisbon, Portugal</b><br><span style="color:#717171">For sights like Belém Tower</span></div></div><div class="r"><i>⛰</i><div><b>Chamonix, France</b><br><span style="color:#717171">Popular with travellers near you</span></div></div></div>
<div class="grid"><div></div><div></div><div></div><div></div></div>
</body></html>
