<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint 3D linework</title>
<style>
  :root { --ground: #0e2a47; --ink: #e8f1fb; --ink-dim: #7fa3c6; --accent: #ffb347; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 12px/1.3 ui-monospace, "SFMono-Regular", Menlo, monospace; }
  #scene { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tag { position: absolute; transform: translate(14px, -50%); white-space: nowrap; letter-spacing: .04em; }
  .tag::before { content: ""; position: absolute; left: -14px; top: 50%; width: 12px; border-top: 1px solid currentColor; }
  .tag b { font-weight: 600; }
  .tag { background: var(--ground); padding: 1px 4px; }
  .tag.sel { color: var(--accent); }
  .title { position: fixed; left: 24px; top: 20px; font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .title small { display: block; font: 11px ui-monospace, monospace; color: var(--ink-dim); letter-spacing: .04em; text-transform: none; }
  .legend { position: fixed; right: 24px; bottom: 20px; color: var(--ink-dim); text-align: right; }
</style>
</head>
<body>
<div id="scene" role="img" aria-label="Blueprint-style 3D view of a data hall: two rows of cabinets, cabinet B-06 selected and highlighted, power and network layers drawn as planes above"></div>
<div id="labels" aria-hidden="true"></div>
<p class="title">Frankfurt DC3 · Hall A<small>Layer 6 hosting · blueprint style · scale 1:50</small></p>
<p class="legend">— outline = cabinet &nbsp; ▨ hatch = thermal load &nbsp; <span style="color:var(--accent)">■</span> selected</p>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const INK = 0xe8f1fb, DIM = 0x7fa3c6, ACCENT = 0xffb347, GROUND = 0x0e2a47;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(GROUND);
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);

// Grid floor: minor + major lines in a fragment shader (crisp at any zoom via fwidth).
function gridMaterial(opacity) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uInk: { value: new THREE.Color(DIM) }, uOpacity: { value: opacity } },
    vertexShader: `varying vec2 vP; void main(){ vP = (modelMatrix*vec4(position,1.)).xz; gl_Position = projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uInk; uniform float uOpacity; varying vec2 vP;
      float line(vec2 p, float s){ vec2 g = abs(fract(p/s - .5) - .5) / fwidth(p/s); return 1. - min(min(g.x,g.y), 1.); }
      void main(){ float a = line(vP, .5)*.35 + line(vP, 2.5)*.9; gl_FragColor = vec4(uInk, a*uOpacity); }`
  });
}
function plane(y, w, d, opacity) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), gridMaterial(opacity));
  m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m;
}
// Hatch material for "thermal load": diagonal lines whose density encodes heat.
function hatchMaterial(density) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uInk: { value: new THREE.Color(INK) }, uD: { value: density } },
    vertexShader: `varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.); }`,
    fragmentShader: `uniform vec3 uInk; uniform float uD; varying vec3 vW;
      void main(){ float v = (vW.x + vW.y + vW.z) * uD; float d = abs(fract(v) - .5) / fwidth(v); gl_FragColor = vec4(uInk, (1. - min(d, 1.)) * .55); }`
  });
}
const lineMats = [];
function outline(geo, color, width) {
  const edges = new THREE.EdgesGeometry(geo, 15);
  const g = new LineSegmentsGeometry().fromEdgesGeometry(edges);
  const m = new LineMaterial({ color, linewidth: width, transparent: true, opacity: 1 });
  m.resolution.set(innerWidth, innerHeight); lineMats.push(m);
  return new LineSegments2(g, m);
}

plane(0, 22, 12, 1);
const cabGeo = new THREE.BoxGeometry(0.8, 2.1, 1.1);
const fill = new THREE.MeshBasicMaterial({ color: GROUND, transparent: true, opacity: 0.85 });
const tags = [];
const rows = ['A', 'B'];
rows.forEach((row, r) => {
  for (let c = 0; c < 12; c++) {
    if ((r * 12 + c) % 7 === 2) continue; // empty positions
    const id = `${row}-${String(c + 1).padStart(2, '0')}`;
    const sel = id === 'B-06';
    const g = new THREE.Group();
    g.position.set(c - 5.5, 1.05, r * 3 - 1.5);
    g.add(new THREE.Mesh(cabGeo, fill));
    g.add(outline(cabGeo, sel ? ACCENT : INK, sel ? 2.4 : 1.2));
    const heat = [0.6, 0, 0, 1.4, 0, 0.9][c % 6];
    if (heat && !sel) { const h = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 2.1), hatchMaterial(heat * 4)); h.position.z = 0.56; g.add(h); }
    scene.add(g);
    if (sel || c === 0 || c === 11) tags.push({ obj: g, text: sel ? `<b>${id}</b> · fr-prd-vm-2217 · UPS-A/PDU-1A` : id, sel, dy: 1.25 });
  }
});
// Two logical layers above, joined to the selected cabinet by a "thread".
const upper = [[4.2, 'L5 · CIs'], [7.4, 'L4 · Environments']];
upper.forEach(([y, label]) => {
  plane(y, 22, 12, 0.35);
  const frame = outline(new THREE.BoxGeometry(22, 0.001, 12), DIM, 1);
  frame.position.y = y; scene.add(frame);
  const anchor = new THREE.Object3D(); anchor.position.set(-11, y, -6); scene.add(anchor);
  tags.push({ obj: anchor, text: label, sel: false, dy: 0 });
});
const node = new THREE.BoxGeometry(1.2, 0.25, 0.6);
[4.2, 7.4].forEach(y => { const n = outline(node, ACCENT, 2); n.position.set(-0.5, y + 0.13, 1.5); scene.add(n); });
const thread = new LineSegmentsGeometry().setPositions([-0.5, 2.1, 1.5, -0.5, 4.2, 1.5, -0.5, 4.45, 1.5, -0.5, 7.4, 1.5]);
const tm = new LineMaterial({ color: ACCENT, linewidth: 2, dashed: true, dashSize: 0.25, gapSize: 0.15 });
tm.resolution.set(innerWidth, innerHeight); lineMats.push(tm);
const threadLine = new LineSegments2(thread, tm); threadLine.computeLineDistances(); scene.add(threadLine);

const labels = document.getElementById('labels');
tags.forEach(t => { t.el = document.createElement('div'); t.el.className = 'tag' + (t.sel ? ' sel' : ''); t.el.innerHTML = t.text; labels.appendChild(t.el); });
const v = new THREE.Vector3();
let theta = 0.62;
function frame(time) {
  if (!reduced) theta = 0.62 + Math.sin(time / 6000) * 0.08; // slow draughtsman drift; none under reduced motion
  camera.position.set(Math.sin(theta) * 24, 15, Math.cos(theta) * 24);
  camera.lookAt(0, 3.4, 0);
  renderer.render(scene, camera);
  tags.forEach(t => { t.obj.getWorldPosition(v); v.y += t.dy; v.project(camera); t.el.style.left = (v.x * .5 + .5) * innerWidth + 'px'; t.el.style.top = (-v.y * .5 + .5) * innerHeight + 'px'; });
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); lineMats.forEach(m => m.resolution.set(innerWidth, innerHeight)); if (reduced) requestAnimationFrame(frame); });
window.__ready = true;
</script>
</body>
</html>
