<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#4b4b4b;font:17px/1.4 system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden}
.top{display:flex;align-items:center;gap:20px;max-width:1000px;margin:40px auto 0;padding:0 24px}.x{font-size:26px;color:#afafaf}
.bar{flex:1;height:16px;background:#e5e5e5;border-radius:99px}.bar i{display:block;width:45%;height:100%;background:#58cc02;border-radius:99px;box-shadow:inset 0 -4px #0001}
.q{max-width:640px;margin:56px auto 0;display:flex;align-items:center;gap:20px}.mas{width:110px;height:110px;border-radius:50%;background:#58cc02;flex:none;position:relative}
.mas:before,.mas:after{content:"";position:absolute;top:34px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:inset -6px -2px 0 6px #4b4b4b}.mas:before{left:24px}.mas:after{right:24px}
.bub{border:2px solid #e5e5e5;border-radius:16px;padding:16px 20px;font-weight:700;font-size:20px;color:#3c3c3c}
.o{max-width:640px;margin:40px auto 0;display:grid;gap:12px}.o div{border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:14px;padding:16px 20px;font-weight:700;display:flex;gap:16px}
.o .s{border-color:#84d8ff;background:#ddf4ff;color:#1899d6}
.foot{position:absolute;bottom:0;left:0;right:0;border-top:2px solid #e5e5e5;padding:28px;display:flex;justify-content:flex-end;padding-right:15%}
.foot a{background:#58cc02;color:#fff;font-weight:800;letter-spacing:.06em;padding:14px 48px;border-radius:14px;box-shadow:0 4px #58a700}
</style></head><body>
<div class="top"><span class="x">✕</span><div class="bar"><i></i></div></div>
<div class="q"><div class="mas"></div><div class="bub">Why are you learning Spanish?</div></div>
<div class="o"><div>✈️ Prepare for travel</div><div class="s">💼 Boost my career</div><div>🧠 Exercise my brain</div><div>👪 Connect with people</div><div>📚 Support my education</div></div>
<div class="foot"><a>CONTINUE</a></div>
</body></html>
