<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{background:#f5f5f7;color:#1d1d1f;font:16px/1.4 system-ui,-apple-system,sans-serif;padding:48px 96px;height:100vh;overflow:hidden}
h2{font-size:44px;letter-spacing:-.02em;margin-bottom:28px}
.g{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:16px}
.t{background:#fff;border-radius:26px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.t b{font-size:54px;letter-spacing:-.02em;line-height:1}.t span{color:#6e6e73;margin-top:6px}
.w2{grid-column:span 2}.h2{grid-row:span 2}.d{background:#1d1d1f;color:#f5f5f7}.d span{color:#a1a1a6}
.grad b{background:linear-gradient(90deg,#0071e3,#a855f7);-webkit-background-clip:text;color:transparent;font-size:80px}
</style></head><body>
<h2>Get the highlights.</h2>
<div class="g">
<div class="t w2 h2 grad"><b>2× faster</b><span>The fastest chip we've ever made.</span></div>
<div class="t"><b>48MP</b><span>Main camera</span></div>
<div class="t d"><b>29h</b><span>Video playback</span></div>
<div class="t w2 d"><b>All‑day</b><span>Battery that keeps up with you.</span></div>
<div class="t"><b>IP68</b><span>Water resistance</span></div>
<div class="t w2"><b>Titanium</b><span>Lightest design yet.</span></div>
<div class="t"><b>USB‑C</b><span>Up to 20× faster transfers</span></div>
</div></body></html>
