<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Panels benchmark</title>
<link rel="stylesheet" href="LIB.css">
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%} body{background:#fcfcfb;color:#1f1f1e;font:13px/1.4 system-ui,sans-serif}
  header{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #ecebe7}
  header b{font-size:15px} header span{color:#52514e}
  #app{position:absolute;top:40px;left:0;right:0;bottom:0}
  .pane{width:100%;height:100%;overflow:hidden;background:#fff}
  .pane-title{height:28px;line-height:28px;padding:0 10px;font-weight:600;border-bottom:1px solid #f0efeb}
  canvas{display:block}
</style></head><body>
<header><b id="lib">Library</b><span>Same three-pane workspace · resize, keyboard, reset, persist, rearrange · 20k-point canvas in every pane</span></header>
<main id="app"></main>
<script src="LIB.js"></script>
</body></html>
